<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>별빛 수비대</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #05060f;
    color: #f4f1ff;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 게임 화면: 가로:세로 = 4:3 비율을 지키면서 창 크기에 맞춘다 */
  #game {
    position: relative;
    width: min(100vw, calc(100vh * 4 / 3));
    width: min(100vw, calc(100dvh * 4 / 3)); /* 휴대폰 주소창 높이까지 계산 (지원하는 브라우저만) */
    aspect-ratio: 4 / 3;
    overflow: hidden;
    background: #05040f;
    /* 휴대폰에서 화면을 끌 때 페이지가 움직이거나 확대되지 않게 */
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  #game.playing { cursor: none; }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  /* 시작 화면과 결과 화면 */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5vmin;
    padding: 16px;
    text-align: center;
    background: rgba(5, 6, 20, 0.72);
  }

  #overlay[hidden] { display: none; }

  #title {
    font-size: clamp(44px, 12vmin, 104px);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: #fff;
    /* 네온사인처럼 빛나는 글자 */
    text-shadow: 0 0 6px #ff3df5, 0 0 20px #ff3df5, 0 0 44px #9b2cff;
  }

  #overlay.gameover #title { text-shadow: 0 0 6px #ff2d6f, 0 0 20px #ff2d6f, 0 0 44px #ff2d6f; }
  #overlay.clear #title { text-shadow: 0 0 6px #39ff88, 0 0 20px #39ff88, 0 0 44px #2de2ff; }

  #message {
    font-size: clamp(15px, 2.6vmin, 22px);
    line-height: 1.6;
    color: #c9c6e6;
    white-space: pre-line;
  }

  #startButton {
    margin-top: 1vmin;
    padding: 0.7em 1.8em;
    font: inherit;
    font-size: clamp(18px, 3.2vmin, 28px);
    font-weight: 700;
    color: #2de2ff;
    background: rgba(45, 226, 255, 0.06);
    border: 2px solid #2de2ff;
    border-radius: 999px;
    cursor: pointer;
    text-shadow: 0 0 8px #2de2ff;
    box-shadow: 0 0 14px #2de2ff, inset 0 0 14px rgba(45, 226, 255, 0.35);
    transition: transform 0.1s, background 0.1s;
  }

  #startButton:hover { background: rgba(45, 226, 255, 0.18); transform: scale(1.05); }
  #startButton:active { transform: scale(0.97); }
  #startButton:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

  /* 오른쪽 아래 구석의 소리 켜기/끄기 버튼 */
  #soundButton {
    position: absolute;
    right: 12px;
    bottom: 12px;
    z-index: 2;
    width: 44px;
    height: 44px;
    font-size: 20px;
    line-height: 1;
    color: #39ff88;
    background: rgba(5, 4, 15, 0.6);
    border: 2px solid #39ff88;
    border-radius: 50%;
    box-shadow: 0 0 10px #39ff88;
    cursor: pointer;
  }

  #soundButton.off {
    border-color: #5a5870;
    box-shadow: none;
    opacity: 0.7;
  }

  #soundButton:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
  <div id="game">
    <canvas id="canvas"></canvas>
    <div id="overlay">
      <h1 id="title">별빛 수비대</h1>
      <p id="message"></p>
      <button id="startButton" type="button">게임 시작</button>
    </div>
    <button id="soundButton" type="button" aria-label="소리 끄기">🔊</button>
  </div>

<script>
// ===== 1. 기본 설정 (숫자를 바꾸면 게임 난이도가 달라져요) =====
const WIDTH = 800;             // 게임 화면 가로 크기
const HEIGHT = 600;            // 게임 화면 세로 크기

const SHIP_Y = 545;            // 우주선의 높이 위치
const SHIP_SPEED = 420;        // 방향키로 움직이는 속도
const SHIP_HALF_W = 22;        // 우주선이 맞는 범위 (가로 절반)
const SHIP_HALF_H = 18;        // 우주선이 맞는 범위 (세로 절반)

const BULLET_SPEED = 560;      // 내 총알 속도
const FIRE_DELAY = 0.32;       // 다음 총알까지 기다리는 시간(초)

const ROWS = 4;                // 외계인 줄 수
const COLS = 8;                // 외계인 칸 수
const GAP_X = 72;              // 외계인 사이 가로 간격
const GAP_Y = 54;              // 외계인 사이 세로 간격
const ALIEN_HALF_W = 22;       // 외계인이 맞는 범위 (가로 절반)
const ALIEN_HALF_H = 18;       // 외계인이 맞는 범위 (세로 절반)
const ALIEN_SPEED_START = 40;  // 처음 외계인 속도
const ALIEN_SPEED_BONUS = 110; // 외계인이 줄어들수록 빨라지는 정도
const ALIEN_DROP = 16;         // 벽에 닿으면 내려오는 거리

const ENEMY_BULLET_SPEED = 260;// 외계인 총알 속도
const ENEMY_FIRE_MIN = 0.7;    // 외계인 총알 사이 가장 짧은 시간(초)
const ENEMY_FIRE_MAX = 1.4;    // 외계인 총알 사이 가장 긴 시간(초)

const ALIEN_SCORE = 10;        // 외계인 한 마리를 맞힐 때 얻는 점수
const MAX_LIVES = 3;           // 처음 목숨 개수
const HIT_SAFE_TIME = 2;       // 맞은 뒤 안 다치는 시간(초)
const SHIELD_SAFE_TIME = 1;    // 방어막이 막아준 뒤 안 다치는 시간(초)

const ITEM_CHANCE = 0.1;       // 아이템이 떨어질 확률 (0.1 = 10%)
const ITEM_SPEED = 130;        // 아이템이 떨어지는 속도
const DOUBLE_SHOT_TIME = 10;   // 총알 두 발이 유지되는 시간(초)

const LAST_STAGE = 5;          // 이 스테이지를 깨면 "클리어!"
const STAGE_SPEED_UP = 18;     // 스테이지마다 외계인이 빨라지는 정도
const STAGE_FIRE_UP = 0.1;     // 스테이지마다 외계인 총알이 잦아지는 정도
const BANNER_TIME = 1.8;       // "스테이지 N" 글자가 나오는 시간(초)
const FORMATION_Y = 90;        // 외계인 무리가 자리 잡는 높이

const DIVE_FIRST_STAGE = 2;    // 급강하가 시작되는 스테이지
const MAX_DIVERS = 3;          // 동시에 급강하할 수 있는 외계인 수

const TOUCH_SENSITIVITY = 1.3; // 휴대폰에서 손가락을 끈 거리보다 우주선이 몇 배 더 움직일지
const BEST_SCORE_KEY = "starDefenseBestScore"; // 최고 점수를 저장할 이름

// 글자 모양
const FONT = "-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif";

// 줄마다 다른 네온 색 (분홍, 주황, 연두, 하늘)
const ROW_COLORS = ["#ff3df5", "#ff9e2c", "#39ff88", "#2de2ff"];


// ===== 2. 화면 요소 가져오기 =====
const gameBox = document.getElementById("game");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const titleText = document.getElementById("title");
const messageText = document.getElementById("message");
const startButton = document.getElementById("startButton");
const soundButton = document.getElementById("soundButton");


// ===== 3. 게임 상태 =====
let state = "start";        // start(시작 전) / playing(게임 중) / gameover / clear
let shipX = WIDTH / 2;
let shipAlive = true;
let score = 0;
let lives = MAX_LIVES;
let stage = 1;
let bannerTimer = 0;        // "스테이지 N" 글자가 남은 시간
let safeTimer = 0;          // 안 다치는 시간이 얼마나 남았는지
let doubleShotTimer = 0;    // 총알 두 발이 얼마나 남았는지
let hasShield = false;      // 방어막이 있는지
let diveTimer = 0;          // 다음 급강하까지 남은 시간
let fireTimer = 0;          // 다음 총알까지 남은 시간
let enemyFireTimer = 1;     // 다음 외계인 총알까지 남은 시간
let aliens = [];
let bullets = [];
let enemyBullets = [];
let items = [];             // 떨어지는 아이템
let particles = [];         // 폭발 조각
let rings = [];             // 폭발할 때 퍼지는 빛 고리
let floatTexts = [];        // 잠깐 떠오르는 글자
let groupX = 0;             // 외계인 무리의 위치
let groupY = 0;
let groupDir = 1;           // 1이면 오른쪽, -1이면 왼쪽
let time = 0;               // 게임이 켜진 뒤 지난 시간
let bestScore = loadBestScore(); // 지금까지의 최고 점수

// 입력 상태
let leftKey = false;
let rightKey = false;
let spaceKey = false;
let mouseDown = false;
let shotWaiting = false;    // 눌렀지만 아직 나가지 않은 총알

// 휴대폰(터치 화면)인지: 터치 화면이면 총알이 자동으로 나간다
let touchMode = window.matchMedia("(pointer: coarse)").matches;
let touchId = null;         // 지금 화면을 끌고 있는 손가락
let touchStartX = 0;        // 손가락을 처음 댄 위치
let touchShipStartX = 0;    // 손가락을 처음 댔을 때 우주선 위치

// 뒤에 천천히 흐르는 별
// 멀리 있는 별은 작고 느리게, 가까운 별은 크고 조금 빠르게 흘러서 깊이감이 생긴다
const STAR_SIZES = [0.8, 1.4, 2.2];
const STAR_SPEEDS = [6, 13, 24];
const STAR_COLORS = ["#ffffff", "#a8f0ff", "#ffc2f7"];
const stars = [];
for (let i = 0; i < 140; i++) {
  const layer = i % 3; // 0: 먼 별, 1: 중간, 2: 가까운 별
  stars.push({
    x: Math.random() * WIDTH,
    y: Math.random() * HEIGHT,
    size: STAR_SIZES[layer],
    speed: STAR_SPEEDS[layer] + Math.random() * 4,
    color: STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)],
    phase: Math.random() * Math.PI * 2
  });
}


// ===== 4. 게임 준비와 화면 전환 =====
function resetGame() {
  shipX = WIDTH / 2;
  shipAlive = true;
  score = 0;
  lives = MAX_LIVES;
  safeTimer = 0;
  doubleShotTimer = 0;
  hasShield = false;
  fireTimer = 0;
  items = [];
  particles = [];
  rings = [];
  floatTexts = [];
}

// 외계인 4줄 x 8칸 만들기
function spawnAliens() {
  groupX = (WIDTH - (COLS - 1) * GAP_X) / 2;
  groupY = FORMATION_Y;
  groupDir = 1;

  aliens = [];
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      aliens.push({ row: row, col: col, dive: null });
    }
  }
}

// 스테이지 시작: 먼저 "스테이지 N" 글자를 보여준다
function beginStage(number) {
  stage = number;
  bannerTimer = BANNER_TIME;
  aliens = [];
  bullets = [];
  enemyBullets = [];
}

// 글자가 사라지면 외계인들이 위에서 내려온다
function sendInAliens() {
  spawnAliens();
  groupY = FORMATION_Y - 240;
  enemyFireTimer = 1;
  diveTimer = nextDiveDelay();
}

function startGame() {
  resetGame();
  beginStage(1);
  shotWaiting = false;
  mouseDown = false;
  state = "playing";
  overlay.hidden = true;
  gameBox.classList.add("playing");
  startButton.blur();

  // 브라우저는 사용자가 클릭한 뒤에만 소리를 낼 수 있어서 여기서 소리를 준비한다
  setupAudio();
  startMusic();
}

function endGame(result) {
  state = result;
  stopMusic();
  if (result === "gameover") soundGameOver();
  bullets = [];
  enemyBullets = [];
  items = [];
  overlay.className = result;
  titleText.textContent = result === "clear" ? "클리어!" : "게임 오버";

  // 최고 점수를 넘었으면 브라우저에 새로 저장
  const newRecord = score > bestScore;
  if (newRecord) {
    bestScore = score;
    saveBestScore(bestScore);
  }
  messageText.textContent =
    "이번 점수: " + score + "  ·  스테이지 " + stage + "\n" +
    "최고 점수: " + bestScore +
    (newRecord && score > 0 ? "\n🎉 새 최고 점수!" : "");
  startButton.textContent = "다시 시작";
  overlay.hidden = false;
  gameBox.classList.remove("playing");
}

// 외계인의 실제 화면 위치
// (급강하 중이면 무리와 따로 움직인다)
function slotX(alien) { return groupX + alien.col * GAP_X; }
function slotY(alien) { return groupY + alien.row * GAP_Y; }
function alienX(alien) { return alien.dive ? alien.dive.x : slotX(alien); }
function alienY(alien) { return alien.dive ? alien.dive.y : slotY(alien); }


// ===== 5. 입력 처리 (키보드, 마우스) =====
window.addEventListener("keydown", function (e) {
  // M 키로도 소리를 켜고 끌 수 있다
  if (e.code === "KeyM" && !e.repeat) {
    toggleSound();
    return;
  }
  if (state !== "playing") return;

  if (e.code === "ArrowLeft") leftKey = true;
  else if (e.code === "ArrowRight") rightKey = true;
  else if (e.code === "Space") {
    spaceKey = true;
    if (!e.repeat) shotWaiting = true;
  } else return;

  e.preventDefault(); // 스페이스바로 화면이 움직이는 것을 막기
});

window.addEventListener("keyup", function (e) {
  if (e.code === "ArrowLeft") leftKey = false;
  else if (e.code === "ArrowRight") rightKey = false;
  else if (e.code === "Space") spaceKey = false;
});

window.addEventListener("pointermove", function (e) {
  if (state !== "playing") return;
  const box = canvas.getBoundingClientRect();

  if (e.pointerType === "touch") {
    // 휴대폰: 손가락을 끈 만큼 우주선이 따라 움직인다
    // (손가락이 우주선을 가리지 않도록 화면 아무 데나 끌어도 된다)
    if (e.pointerId !== touchId) return;
    const moved = (e.clientX - touchStartX) / box.width * WIDTH;
    shipX = touchShipStartX + moved * TOUCH_SENSITIVITY;
  } else {
    // 컴퓨터: 마우스가 있는 곳으로 우주선이 간다
    shipX = (e.clientX - box.left) / box.width * WIDTH;
  }
  keepShipInside();
});

window.addEventListener("pointerdown", function (e) {
  if (state !== "playing") return;

  if (e.pointerType === "touch") {
    touchMode = true;
    touchId = e.pointerId;
    touchStartX = e.clientX;
    touchShipStartX = shipX;
    return;
  }
  if (e.button !== 0) return;
  mouseDown = true;
  shotWaiting = true;
});

function endPointer(e) {
  if (e.pointerId === touchId) touchId = null;
  else mouseDown = false;
}
window.addEventListener("pointerup", endPointer);
window.addEventListener("pointercancel", endPointer);

// 다른 창으로 넘어가면 누르고 있던 키를 모두 뗀 것으로 처리
window.addEventListener("blur", function () {
  leftKey = rightKey = spaceKey = mouseDown = false;
  touchId = null;
});

startButton.addEventListener("click", startGame);

soundButton.addEventListener("click", function () {
  toggleSound();
  soundButton.blur(); // 스페이스바가 버튼을 누르지 않도록
});
// 소리 버튼을 눌러도 총알이 나가지 않게 한다
soundButton.addEventListener("pointerdown", function (e) { e.stopPropagation(); });

function keepShipInside() {
  const edge = SHIP_HALF_W + 8;
  shipX = Math.max(edge, Math.min(WIDTH - edge, shipX));
}


// ===== 6. 매 순간 게임 내용 바꾸기 =====
function update(dt) {
  moveShip(dt);
  shoot(dt);
  updateTimers(dt);
  moveMyBullets(dt);
  moveEnemyBullets(dt);
  moveItems(dt);
  if (state !== "playing") return;

  // "스테이지 N" 글자가 나오는 동안
  if (bannerTimer > 0) {
    bannerTimer -= dt;
    if (bannerTimer <= 0) sendInAliens();
    return;
  }
  if (checkStageClear()) return;

  // 외계인들이 자리로 내려오는 동안
  if (groupY < FORMATION_Y) {
    groupY = Math.min(FORMATION_Y, groupY + 300 * dt);
    return;
  }

  moveAliens(dt);
  if (state !== "playing") return;
  moveDivers(dt);
  if (state !== "playing") return;
  if (checkStageClear()) return;
  startDive(dt);
  enemyShoot(dt);
}

function updateTimers(dt) {
  if (safeTimer > 0) safeTimer -= dt;
  if (doubleShotTimer > 0) doubleShotTimer -= dt;
}

// 외계인을 다 물리쳤으면 다음 스테이지로
function checkStageClear() {
  if (aliens.length > 0) return false;
  if (stage >= LAST_STAGE) endGame("clear");
  else beginStage(stage + 1);
  return true;
}

function moveShip(dt) {
  if (leftKey) shipX -= SHIP_SPEED * dt;
  if (rightKey) shipX += SHIP_SPEED * dt;
  keepShipInside();
}

function shoot(dt) {
  fireTimer -= dt;
  // 휴대폰에서는 따로 누르지 않아도 계속 쏜다
  const wantsToShoot = touchMode || spaceKey || mouseDown || shotWaiting;
  if (wantsToShoot && fireTimer <= 0) {
    if (doubleShotTimer > 0) {
      bullets.push({ x: shipX - 11, y: SHIP_Y - 14 });
      bullets.push({ x: shipX + 11, y: SHIP_Y - 14 });
    } else {
      bullets.push({ x: shipX, y: SHIP_Y - 24 });
    }
    soundShoot();
    fireTimer = FIRE_DELAY;
    shotWaiting = false;
  }
}

// 내 총알: 위로 날아가다가 외계인에 맞으면 둘 다 사라진다
function moveMyBullets(dt) {
  for (const bullet of bullets) {
    bullet.y -= BULLET_SPEED * dt;

    for (const alien of aliens) {
      if (alien.dead) continue;
      const hitX = Math.abs(bullet.x - alienX(alien)) < ALIEN_HALF_W;
      const hitY = Math.abs(bullet.y - alienY(alien)) < ALIEN_HALF_H;
      if (hitX && hitY) {
        bullet.dead = true;
        alien.dead = true;
        score += ALIEN_SCORE;
        explode(alienX(alien), alienY(alien), ROW_COLORS[alien.row], 22);
        soundExplode();
        maybeDropItem(alienX(alien), alienY(alien));
        break;
      }
    }
  }
  bullets = bullets.filter(function (b) { return !b.dead && b.y > -20; });
  aliens = aliens.filter(function (a) { return !a.dead; });
}

// 외계인 총알: 아래로 날아가다가 우주선에 맞으면 목숨이 줄어든다
function moveEnemyBullets(dt) {
  for (const bullet of enemyBullets) {
    bullet.y += ENEMY_BULLET_SPEED * dt;
    const hitX = Math.abs(bullet.x - shipX) < SHIP_HALF_W;
    const hitY = Math.abs(bullet.y - SHIP_Y) < SHIP_HALF_H;
    if (hitX && hitY && safeTimer <= 0) {
      bullet.dead = true;
      hitShip();
      if (state !== "playing") return;
    }
  }
  enemyBullets = enemyBullets.filter(function (b) { return !b.dead && b.y < HEIGHT + 20; });
}

// 10% 확률로 아이템 떨어뜨리기 (초록/노랑 반반)
function maybeDropItem(x, y) {
  if (Math.random() < ITEM_CHANCE) {
    items.push({ x: x, y: y, type: Math.random() < 0.5 ? "double" : "shield" });
  }
}

function moveItems(dt) {
  for (const item of items) {
    item.y += ITEM_SPEED * dt;
    const caughtX = Math.abs(item.x - shipX) < SHIP_HALF_W + 14;
    const caughtY = Math.abs(item.y - SHIP_Y) < SHIP_HALF_H + 14;
    if (caughtX && caughtY) {
      item.dead = true;
      if (item.type === "double") {
        doubleShotTimer = DOUBLE_SHOT_TIME;
        addFloatText("총알 두 발!", "#4fe07a");
      } else {
        hasShield = true;
        addFloatText("방어막!", "#ffd23c");
      }
    }
  }
  items = items.filter(function (i) { return !i.dead && i.y < HEIGHT + 20; });
}

// 우주선이 맞았을 때: 방어막이 먼저 막고, 없으면 목숨이 줄어든다
function hitShip() {
  if (hasShield) {
    hasShield = false;
    safeTimer = SHIELD_SAFE_TIME;
    explode(shipX, SHIP_Y, "#ffd23c", 16);
    addFloatText("막았다!", "#ffd23c");
    return;
  }

  lives -= 1;
  if (lives <= 0) {
    destroyShip();
    return;
  }
  safeTimer = HIT_SAFE_TIME;
  explode(shipX, SHIP_Y, "#ffe9a8", 24);
}

function moveAliens(dt) {
  // 외계인이 줄어들수록 빨라진다
  const killedRate = 1 - aliens.length / (ROWS * COLS);
  const stageSpeed = ALIEN_SPEED_START + (stage - 1) * STAGE_SPEED_UP;
  const speed = stageSpeed + ALIEN_SPEED_BONUS * killedRate;
  groupX += speed * groupDir * dt;

  // 살아있는 외계인 중 가장 왼쪽, 오른쪽, 아래쪽 찾기
  let leftCol = COLS;
  let rightCol = 0;
  let bottomRow = 0;
  for (const alien of aliens) {
    leftCol = Math.min(leftCol, alien.col);
    rightCol = Math.max(rightCol, alien.col);
    bottomRow = Math.max(bottomRow, alien.row);
  }

  // 벽에 닿으면 방향을 바꾸고 한 칸 내려온다
  const edge = ALIEN_HALF_W + 12;
  const leftLimit = edge - leftCol * GAP_X;
  const rightLimit = WIDTH - edge - rightCol * GAP_X;
  if (groupDir > 0 && groupX > rightLimit) {
    groupX = rightLimit;
    groupDir = -1;
    groupY += ALIEN_DROP;
  } else if (groupDir < 0 && groupX < leftLimit) {
    groupX = leftLimit;
    groupDir = 1;
    groupY += ALIEN_DROP;
  }

  // 외계인이 우주선 높이까지 내려오면 게임 오버
  const alienBottom = groupY + bottomRow * GAP_Y + ALIEN_HALF_H;
  if (alienBottom >= SHIP_Y - SHIP_HALF_H) {
    destroyShip();
  }
}

function enemyShoot(dt) {
  enemyFireTimer -= dt;
  if (enemyFireTimer > 0) return;

  // 칸마다 맨 아래 외계인만 쏠 수 있다 (급강하 중인 외계인은 쏘지 않는다)
  const shooters = {};
  for (const alien of aliens) {
    if (alien.dive) continue;
    const current = shooters[alien.col];
    if (!current || alien.row > current.row) shooters[alien.col] = alien;
  }
  const list = Object.values(shooters);
  const shooter = list[Math.floor(Math.random() * list.length)];
  if (shooter) enemyBullets.push({ x: alienX(shooter), y: alienY(shooter) + 20 });

  // 스테이지가 오를수록 더 자주 쏜다
  const delay = ENEMY_FIRE_MIN + Math.random() * (ENEMY_FIRE_MAX - ENEMY_FIRE_MIN);
  enemyFireTimer = delay * (1 - (stage - 1) * STAGE_FIRE_UP);
}

// 다음 급강하까지 기다리는 시간 (스테이지가 오를수록 짧아진다)
function nextDiveDelay() {
  return Math.max(1, 5 - stage * 0.6) + Math.random() * 1.5;
}

// 무리에서 한 마리를 골라 급강하 시작
function startDive(dt) {
  if (stage < DIVE_FIRST_STAGE) return;
  diveTimer -= dt;
  if (diveTimer > 0) return;
  diveTimer = nextDiveDelay();

  const divingCount = aliens.filter(function (a) { return a.dive; }).length;
  if (divingCount >= Math.min(stage - 1, MAX_DIVERS)) return;

  const waiting = aliens.filter(function (a) { return !a.dive; });
  if (waiting.length === 0) return;
  const alien = waiting[Math.floor(Math.random() * waiting.length)];

  const startX = slotX(alien);
  const startY = slotY(alien);
  alien.dive = {
    going: "down",
    t: 0,
    duration: Math.max(1.8, 3 - (stage - 2) * 0.25),
    startX: startX,
    startY: startY,
    endX: shipX,                                       // 우주선이 있던 곳을 노린다
    curve: (Math.random() < 0.5 ? -1 : 1) * (90 + Math.random() * 70), // 휘는 정도와 방향
    x: startX,
    y: startY
  };
}

// 급강하하는 외계인 움직이기
function moveDivers(dt) {
  for (const alien of aliens) {
    const d = alien.dive;
    if (!d) continue;

    d.t += dt;
    const p = Math.min(d.t / d.duration, 1); // 0(출발)부터 1(도착)까지

    if (d.going === "down") {
      // 내려가면서 사인(sin) 곡선으로 좌우로 휜다
      const x = d.startX + (d.endX - d.startX) * p + Math.sin(p * Math.PI * 2) * d.curve;
      d.x = Math.max(ALIEN_HALF_W, Math.min(WIDTH - ALIEN_HALF_W, x));
      d.y = d.startY + (HEIGHT + 40 - d.startY) * (0.6 * p + 0.4 * p * p);

      // 우주선과 부딪히면 외계인은 터지고 목숨이 줄어든다
      const hitX = Math.abs(d.x - shipX) < SHIP_HALF_W + ALIEN_HALF_W - 8;
      const hitY = Math.abs(d.y - SHIP_Y) < SHIP_HALF_H + ALIEN_HALF_H - 6;
      if (hitX && hitY && safeTimer <= 0) {
        alien.dead = true;
        explode(d.x, d.y, ROW_COLORS[alien.row], 22);
        soundExplode();
        hitShip();
        if (state !== "playing") return;
        continue;
      }

      // 화면 아래로 나가면 위에서 다시 나타나 자기 자리로 돌아간다
      if (p >= 1) {
        d.going = "back";
        d.t = 0;
        d.duration = 1.2;
        d.startX = d.x;
        d.startY = -40;
        d.y = -40;
      }
    } else {
      const eased = p * (2 - p);
      d.x = d.startX + (slotX(alien) - d.startX) * eased;
      d.y = d.startY + (slotY(alien) - d.startY) * eased;
      if (p >= 1) alien.dive = null;
    }
  }
  aliens = aliens.filter(function (a) { return !a.dead; });
}

function destroyShip() {
  lives = 0;
  shipAlive = false;
  explode(shipX, SHIP_Y, "#ffe9a8", 40);
  endGame("gameover");
}

function addFloatText(text, color) {
  floatTexts.push({ x: shipX, y: SHIP_Y - 40, text: text, color: color, life: 1 });
}

// 폭발: 작은 조각들이 빙글빙글 돌며 사방으로 흩어지고, 빛 고리가 퍼진다
function explode(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const power = Math.random() * 220 + 60;
    const life = Math.random() * 0.5 + 0.35;
    particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * power,
      vy: Math.sin(angle) * power,
      life: life, maxLife: life,
      color: Math.random() < 0.25 ? "#ffffff" : color, // 가끔 하얀 불꽃
      size: Math.random() * 3 + 1.5,
      turn: Math.random() * Math.PI,          // 지금 기울어진 각도
      spin: (Math.random() - 0.5) * 20        // 도는 빠르기
    });
  }
  rings.push({ x: x, y: y, color: color, life: 0.35, maxLife: 0.35 });
}

// 별과 폭발 조각은 게임 중이 아닐 때도 계속 움직인다
function updateEffects(dt) {
  for (const star of stars) {
    star.y += star.speed * dt;
    if (star.y > HEIGHT) {
      star.y = 0;
      star.x = Math.random() * WIDTH;
    }
  }
  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 1 - 2.5 * dt;   // 공기 저항처럼 점점 느려진다
    p.vy *= 1 - 2.5 * dt;
    p.turn += p.spin * dt;
    p.life -= dt;
  }
  particles = particles.filter(function (p) { return p.life > 0; });

  for (const r of rings) r.life -= dt;
  rings = rings.filter(function (r) { return r.life > 0; });

  for (const t of floatTexts) {
    t.y -= 40 * dt;
    t.life -= dt;
  }
  floatTexts = floatTexts.filter(function (t) { return t.life > 0; });
}


// ===== 7. 그림 그리기 =====

// 어두운 우주 배경: 가운데는 보랏빛, 가장자리는 거의 검정
const spaceGradient = ctx.createRadialGradient(WIDTH / 2, HEIGHT * 0.4, 40, WIDTH / 2, HEIGHT * 0.5, 620);
spaceGradient.addColorStop(0, "#1b0c3f");
spaceGradient.addColorStop(0.55, "#0b0824");
spaceGradient.addColorStop(1, "#030209");

// 은은하게 빛나는 성운(우주 구름) 두 개
const nebulaPink = ctx.createRadialGradient(160, 140, 0, 160, 140, 260);
nebulaPink.addColorStop(0, "rgba(255, 61, 245, 0.14)");
nebulaPink.addColorStop(1, "rgba(255, 61, 245, 0)");
const nebulaBlue = ctx.createRadialGradient(660, 420, 0, 660, 420, 300);
nebulaBlue.addColorStop(0, "rgba(45, 226, 255, 0.11)");
nebulaBlue.addColorStop(1, "rgba(45, 226, 255, 0)");

function draw() {
  ctx.fillStyle = spaceGradient;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);
  ctx.fillStyle = nebulaPink;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);
  ctx.fillStyle = nebulaBlue;
  ctx.fillRect(0, 0, WIDTH, HEIGHT);

  drawStars();
  for (const alien of aliens) drawAlien(alien);
  drawBullets();
  for (const item of items) drawItem(item);
  if (shipAlive) drawShipWithEffects();
  drawParticles();
  drawFloatTexts();
  if (state !== "start") drawHud();
  if (state === "playing" && bannerTimer > 0) drawBanner();
}

function drawStars() {
  for (const star of stars) {
    ctx.fillStyle = star.color;
    ctx.globalAlpha = 0.45 + 0.4 * Math.sin(time * 2 + star.phase);
    ctx.fillRect(star.x, star.y, star.size, star.size);
  }
  ctx.globalAlpha = 1;
}

// 맞은 직후에는 깜빡이고, 방어막이 있으면 노란 원을 두른다
function drawShipWithEffects() {
  if (safeTimer > 0 && Math.floor(time * 12) % 2 === 0) ctx.globalAlpha = 0.3;
  drawShip(shipX, SHIP_Y);
  ctx.globalAlpha = 1;

  if (hasShield) {
    ctx.save();
    ctx.strokeStyle = "#ffe94d";
    ctx.shadowColor = "#ffe94d";
    ctx.shadowBlur = 14;
    ctx.lineWidth = 3;
    ctx.globalAlpha = 0.75 + Math.sin(time * 6) * 0.2;
    ctx.beginPath();
    ctx.arc(shipX, SHIP_Y - 2, 36, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

// 우주선: 별 문양을 단 수비대 비행선
function drawShip(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.shadowColor = "#2de2ff"; // 하늘색 네온 빛
  ctx.shadowBlur = 16;

  // 엔진 불꽃
  const flame = 12 + Math.sin(time * 30) * 4;
  ctx.fillStyle = "#ff3df5";
  ctx.beginPath();
  ctx.moveTo(-7, 14);
  ctx.lineTo(0, 14 + flame);
  ctx.lineTo(7, 14);
  ctx.fill();

  // 뒤로 꺾인 날개
  ctx.fillStyle = "#2de2ff";
  ctx.beginPath();
  ctx.moveTo(-6, -4);
  ctx.lineTo(-26, 16);
  ctx.lineTo(-20, 19);
  ctx.lineTo(-6, 12);
  ctx.closePath();
  ctx.moveTo(6, -4);
  ctx.lineTo(26, 16);
  ctx.lineTo(20, 19);
  ctx.lineTo(6, 12);
  ctx.closePath();
  ctx.fill();

  // 몸통
  ctx.fillStyle = "#eafcff";
  ctx.beginPath();
  ctx.moveTo(0, -24);
  ctx.quadraticCurveTo(11, -4, 9, 15);
  ctx.lineTo(-9, 15);
  ctx.quadraticCurveTo(-11, -4, 0, -24);
  ctx.fill();

  // 별 문양
  ctx.shadowColor = "#ffe94d";
  drawStarShape(0, 2, 7, 3, "#ffe94d");

  ctx.restore();
}

function drawStarShape(x, y, outer, inner, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const radius = i % 2 === 0 ? outer : inner;
    const angle = -Math.PI / 2 + i * Math.PI / 5;
    ctx.lineTo(x + Math.cos(angle) * radius, y + Math.sin(angle) * radius);
  }
  ctx.closePath();
  ctx.fill();
}

// 줄마다 모양이 다른 외계인 네 종류
function drawAlien(alien) {
  const x = alienX(alien);
  const y = alienY(alien);
  const wave = time * 4 + alien.col * 0.7;
  const color = ROW_COLORS[alien.row];

  ctx.save();
  ctx.translate(x, y + Math.sin(wave) * 2);
  ctx.fillStyle = color;
  ctx.strokeStyle = color;
  ctx.shadowColor = color; // 자기 색으로 빛나게
  ctx.shadowBlur = 14;

  if (alien.row === 0) drawJellyfish(wave);
  else if (alien.row === 1) drawCrystal(wave);
  else if (alien.row === 2) drawTripleEye(wave);
  else drawManta(wave);

  ctx.restore();
}

// 눈 하나 그리기
function drawEye(x, y, size) {
  ctx.shadowBlur = 0; // 눈은 또렷하게
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(x, y, size, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#14112e";
  ctx.beginPath();
  ctx.arc(x, y + size * 0.25, size * 0.5, 0, Math.PI * 2);
  ctx.fill();
}

// 1번째 줄: 해파리
function drawJellyfish(wave) {
  ctx.beginPath();
  ctx.arc(0, -3, 17, Math.PI, 0);
  ctx.quadraticCurveTo(17, 3, 12, 3);
  ctx.lineTo(-12, 3);
  ctx.quadraticCurveTo(-17, 3, -17, -3);
  ctx.fill();

  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  for (let i = -1; i <= 1; i++) {
    const startX = i * 10;
    ctx.beginPath();
    ctx.moveTo(startX, 3);
    ctx.quadraticCurveTo(startX + Math.sin(wave + i) * 6, 10, startX, 17);
    ctx.stroke();
  }

  drawEye(-6, -6, 4);
  drawEye(6, -6, 4);
}

// 2번째 줄: 날개 달린 수정
function drawCrystal(wave) {
  const flap = Math.sin(wave * 1.5) * 5;
  ctx.globalAlpha = 0.6;
  ctx.beginPath();
  ctx.moveTo(-10, -4);
  ctx.lineTo(-23, -9 + flap);
  ctx.lineTo(-11, 6);
  ctx.moveTo(10, -4);
  ctx.lineTo(23, -9 + flap);
  ctx.lineTo(11, 6);
  ctx.fill();
  ctx.globalAlpha = 1;

  ctx.beginPath();
  ctx.moveTo(0, -18);
  ctx.lineTo(13, -6);
  ctx.lineTo(9, 9);
  ctx.lineTo(0, 18);
  ctx.lineTo(-9, 9);
  ctx.lineTo(-13, -6);
  ctx.closePath();
  ctx.fill();

  drawEye(0, -1, 6);
}

// 3번째 줄: 눈 세 개 달린 구름 괴물
function drawTripleEye(wave) {
  ctx.beginPath();
  ctx.arc(-9, 2, 11, 0, Math.PI * 2);
  ctx.arc(9, 2, 11, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0, -5, 12, 0, Math.PI * 2);
  ctx.fill();

  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  const tilt = Math.sin(wave) * 3;
  ctx.beginPath();
  ctx.moveTo(-6, -15);
  ctx.lineTo(-11 + tilt, -21);
  ctx.moveTo(6, -15);
  ctx.lineTo(11 + tilt, -21);
  ctx.stroke();

  drawEye(-10, 3, 3.5);
  drawEye(0, -6, 4.5);
  drawEye(10, 3, 3.5);
}

// 4번째 줄: 가오리
function drawManta(wave) {
  const flap = Math.sin(wave * 1.2) * 5;
  ctx.beginPath();
  ctx.moveTo(0, -12);
  ctx.quadraticCurveTo(13, -11, 23, -2 + flap);
  ctx.quadraticCurveTo(12, 3, 7, 11);
  ctx.lineTo(0, 18);
  ctx.lineTo(-7, 11);
  ctx.quadraticCurveTo(-12, 3, -23, -2 + flap);
  ctx.quadraticCurveTo(-13, -11, 0, -12);
  ctx.fill();

  drawEye(-6, -3, 3.5);
  drawEye(6, -3, 3.5);
}

function drawBullets() {
  ctx.save();

  // 내 총알: 하늘색으로 빛나는 레이저
  ctx.shadowColor = "#2de2ff";
  ctx.shadowBlur = 12;
  for (const b of bullets) {
    ctx.fillStyle = "rgba(45, 226, 255, 0.45)";
    ctx.fillRect(b.x - 3.5, b.y - 11, 7, 22);
    ctx.fillStyle = "#eaffff";
    ctx.fillRect(b.x - 1.5, b.y - 9, 3, 18);
  }

  // 외계인 총알: 분홍빛으로 빛나는 구슬
  ctx.shadowColor = "#ff2d6f";
  for (const b of enemyBullets) {
    ctx.fillStyle = "rgba(255, 45, 111, 0.4)";
    ctx.beginPath();
    ctx.arc(b.x, b.y, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ffd0e0";
    ctx.beginPath();
    ctx.arc(b.x, b.y, 3.5, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

function drawParticles() {
  ctx.save();
  ctx.globalCompositeOperation = "lighter"; // 겹치면 더 밝아져서 빛처럼 보인다

  // 퍼지는 빛 고리
  for (const r of rings) {
    const progress = 1 - r.life / r.maxLife; // 0에서 1로
    ctx.globalAlpha = r.life / r.maxLife;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(r.x, r.y, 8 + progress * 34, 0, Math.PI * 2);
    ctx.stroke();
  }

  // 빙글빙글 도는 작은 조각
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.turn);
    ctx.fillRect(-p.size, -p.size / 2, p.size * 2, p.size);
    ctx.restore();
  }

  ctx.restore();
}

// 아이템: 초록은 총알 두 줄, 노랑은 방패 그림
function drawItem(item) {
  const color = item.type === "double" ? "#39ff88" : "#ffe94d";

  ctx.save();
  ctx.translate(item.x, item.y);
  ctx.shadowColor = color;
  ctx.shadowBlur = 16;

  ctx.globalAlpha = 0.3;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(0, 0, 19 + Math.sin(time * 8) * 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.beginPath();
  ctx.arc(0, 0, 14, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.fillStyle = "#14112e";
  if (item.type === "double") {
    ctx.fillRect(-6, -7, 4, 14);
    ctx.fillRect(2, -7, 4, 14);
  } else {
    ctx.beginPath();
    ctx.moveTo(0, -8);
    ctx.lineTo(7, -5);
    ctx.quadraticCurveTo(7, 4, 0, 9);
    ctx.quadraticCurveTo(-7, 4, -7, -5);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawFloatTexts() {
  ctx.save();
  ctx.font = "bold 20px " + FONT;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.shadowBlur = 10;
  for (const t of floatTexts) {
    ctx.globalAlpha = Math.min(t.life * 2, 1);
    ctx.fillStyle = t.color;
    ctx.shadowColor = t.color;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.restore();
}

function drawHeart(x, y, filled) {
  ctx.beginPath();
  ctx.moveTo(x, y + 10);
  ctx.bezierCurveTo(x - 14, y + 1, x - 11, y - 10, x - 5, y - 10);
  ctx.bezierCurveTo(x - 2, y - 10, x, y - 7, x, y - 5);
  ctx.bezierCurveTo(x, y - 7, x + 2, y - 10, x + 5, y - 10);
  ctx.bezierCurveTo(x + 11, y - 10, x + 14, y + 1, x, y + 10);
  ctx.closePath();
  if (filled) {
    ctx.save();
    ctx.fillStyle = "#ff2d6f";
    ctx.shadowColor = "#ff2d6f";
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.restore();
  } else {
    ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

// 화면 위쪽: 점수, 스테이지, 하트, 아이템 상태
function drawHud() {
  ctx.save();
  ctx.font = "bold 20px " + FONT;
  ctx.textBaseline = "top";
  ctx.fillStyle = "#ffffff";
  ctx.shadowColor = "#2de2ff";
  ctx.shadowBlur = 8;

  ctx.textAlign = "left";
  ctx.fillText("점수 " + score, 20, 18);
  ctx.textAlign = "center";
  ctx.shadowColor = "#ff3df5";
  ctx.fillText("스테이지 " + stage, WIDTH / 2, 18);
  ctx.restore();

  for (let i = 0; i < MAX_LIVES; i++) {
    drawHeart(WIDTH - 32 - (MAX_LIVES - 1 - i) * 30, 29, i < lives);
  }

  // 아이템 상태
  ctx.font = "bold 15px " + FONT;
  ctx.textAlign = "left";
  let statusX = 20;
  if (doubleShotTimer > 0) {
    ctx.fillStyle = "#39ff88";
    const label = "두 발 " + Math.ceil(doubleShotTimer) + "초";
    ctx.fillText(label, statusX, 46);
    statusX += ctx.measureText(label).width + 16;
  }
  if (hasShield) {
    ctx.fillStyle = "#ffe94d";
    ctx.fillText("방어막", statusX, 46);
  }
}

function drawBanner() {
  ctx.save();
  ctx.font = "800 60px " + FONT;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#ffffff";
  ctx.shadowColor = "#ff3df5";
  ctx.shadowBlur = 24;
  ctx.globalAlpha = Math.min(bannerTimer * 2, 1);
  ctx.fillText("스테이지 " + stage, WIDTH / 2, HEIGHT / 2 - 30);
  ctx.restore();
}


// ===== 8. 창 크기에 맞게 선명하게 그리기 =====
function fitCanvas() {
  const box = canvas.getBoundingClientRect();
  const pixelRatio = window.devicePixelRatio || 1;
  canvas.width = Math.round(box.width * pixelRatio);
  canvas.height = Math.round(box.height * pixelRatio);
  ctx.setTransform(canvas.width / WIDTH, 0, 0, canvas.height / HEIGHT, 0, 0);
}
window.addEventListener("resize", fitCanvas);
window.addEventListener("orientationchange", function () {
  // 휴대폰을 돌리면 화면 크기가 바뀐 뒤에 다시 맞춘다
  setTimeout(fitCanvas, 200);
});


// ===== 9. 게임 돌리기: 1초에 수십 번 반복한다 =====
let lastTime = performance.now();

function gameLoop(now) {
  // 다른 탭에 갔다 와도 게임이 갑자기 튀지 않도록 시간을 제한
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  time += dt;

  if (state === "playing") update(dt);
  updateEffects(dt);
  draw();

  requestAnimationFrame(gameLoop);
}

// ===== 10. 소리 만들기 (음악 파일 없이 브라우저가 직접 소리를 만든다) =====
let audio = null;           // 소리 장치 (게임 시작 버튼을 누를 때 만든다)
let masterVolume = null;    // 전체 볼륨 조절기
let noiseBuffer = null;     // "치익" 하는 잡음 (폭발 소리에 쓴다)
let soundOn = true;
let musicTimer = null;
let musicStep = 0;
let nextNoteTime = 0;

const VOLUME = 0.5;         // 전체 소리 크기 (0 ~ 1)
const MUSIC_STEP_TIME = 0.2;// 배경음악 한 음의 길이(초)

// 배경음악 악보: 16칸을 계속 반복한다 (숫자는 음 높이, 0은 쉼표)
const MUSIC_MELODY = [
  440, 523.25, 659.25, 523.25,   // 라 도 미 도
  349.23, 440, 523.25, 440,      // 파 라 도 라
  329.63, 392, 523.25, 392,      // 미 솔 도 솔
  293.66, 392, 493.88, 0         // 레 솔 시 (쉼)
];
const MUSIC_BASS = [110, 87.31, 130.81, 98]; // 4칸마다 바뀌는 낮은 음 (라 파 도 솔)

function setupAudio() {
  if (!audio) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return; // 소리를 지원하지 않는 브라우저
    audio = new AudioCtx();
    masterVolume = audio.createGain();
    masterVolume.gain.value = soundOn ? VOLUME : 0;
    masterVolume.connect(audio.destination);

    // 잡음은 한 번만 만들어 두고 계속 다시 쓴다
    const length = Math.floor(audio.sampleRate * 0.5);
    noiseBuffer = audio.createBuffer(1, length, audio.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
  }
  if (audio.state === "suspended") audio.resume();
}

// 음 하나 내기: 높이(freq)에서 시작해 endFreq로 미끄러지며 점점 작아진다
function playTone(freq, endFreq, duration, type, volume, startTime) {
  if (!audio) return;
  const start = startTime || audio.currentTime;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, start);
  osc.frequency.exponentialRampToValueAtTime(endFreq, start + duration);
  gain.gain.setValueAtTime(volume, start);
  gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
  osc.connect(gain);
  gain.connect(masterVolume);
  osc.start(start);
  osc.stop(start + duration + 0.02);
}

// 총알 소리: 높은 음이 빠르게 내려가는 "퓽"
function soundShoot() {
  playTone(900, 240, 0.12, "square", 0.07);
}

// 폭발 소리: 잡음 "콰"와 낮은 "쿵"을 함께
function soundExplode() {
  if (!audio) return;
  const now = audio.currentTime;
  const source = audio.createBufferSource();
  source.buffer = noiseBuffer;
  source.playbackRate.value = 0.8 + Math.random() * 0.4; // 매번 조금씩 다르게

  const filter = audio.createBiquadFilter(); // 높은 소리를 점점 깎아서 둔탁하게
  filter.type = "lowpass";
  filter.frequency.setValueAtTime(3500, now);
  filter.frequency.exponentialRampToValueAtTime(200, now + 0.3);

  const gain = audio.createGain();
  gain.gain.setValueAtTime(0.35, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

  source.connect(filter);
  filter.connect(gain);
  gain.connect(masterVolume);
  source.start(now);
  source.stop(now + 0.32);

  playTone(160, 45, 0.22, "triangle", 0.25);
}

// 게임 오버 소리: 음이 하나씩 내려가며 "따- 따- 따- 띠이잉"
function soundGameOver() {
  if (!audio) return;
  const now = audio.currentTime;
  const notes = [392, 330, 262];
  for (let i = 0; i < notes.length; i++) {
    playTone(notes[i], notes[i] * 0.97, 0.25, "triangle", 0.25, now + i * 0.22);
  }
  playTone(196, 98, 0.9, "sawtooth", 0.15, now + notes.length * 0.22);
}

// 배경음악: 조금 앞의 음들을 미리 예약해 두면 끊기지 않고 흐른다
function scheduleMusic() {
  // 다른 탭에 갔다 오면 밀린 음을 한꺼번에 틀지 않도록 지금부터 다시 시작
  if (nextNoteTime < audio.currentTime) nextNoteTime = audio.currentTime + 0.05;

  while (nextNoteTime < audio.currentTime + 0.15) {
    const note = MUSIC_MELODY[musicStep];
    if (note > 0) playTone(note, note, 0.16, "square", 0.035, nextNoteTime);
    if (musicStep % 4 === 0) {
      const bass = MUSIC_BASS[musicStep / 4];
      playTone(bass, bass, MUSIC_STEP_TIME * 3.5, "triangle", 0.14, nextNoteTime);
    }
    nextNoteTime += MUSIC_STEP_TIME;
    musicStep = (musicStep + 1) % MUSIC_MELODY.length;
  }
}

function startMusic() {
  if (!audio || musicTimer) return;
  musicStep = 0;
  nextNoteTime = audio.currentTime + 0.05;
  musicTimer = setInterval(scheduleMusic, 50);
}

function stopMusic() {
  clearInterval(musicTimer);
  musicTimer = null;
}

// 소리 켜기/끄기
function toggleSound() {
  soundOn = !soundOn;
  if (masterVolume) {
    masterVolume.gain.setTargetAtTime(soundOn ? VOLUME : 0, audio.currentTime, 0.02);
  }
  soundButton.textContent = soundOn ? "🔊" : "🔇";
  soundButton.classList.toggle("off", !soundOn);
  soundButton.setAttribute("aria-label", soundOn ? "소리 끄기" : "소리 켜기");
}

// ===== 11. 최고 점수 저장하기 (브라우저가 기억해서 다시 접속해도 남아 있다) =====
function loadBestScore() {
  try {
    return Number(localStorage.getItem(BEST_SCORE_KEY)) || 0;
  } catch (e) {
    return 0; // 저장 기능을 쓸 수 없는 환경(예: 일부 비공개 창)이면 0점부터
  }
}

function saveBestScore(value) {
  try {
    localStorage.setItem(BEST_SCORE_KEY, String(value));
  } catch (e) {
    // 저장이 안 돼도 게임은 그대로 할 수 있다
  }
}

// 처음 켰을 때 시작 화면 준비
const howToPlay = touchMode
  ? "화면을 손가락으로 좌우로 끌어서 움직이세요! 총알은 자동으로 나가요.\n"
  : "방향키나 마우스로 움직이고, 스페이스바나 클릭으로 쏘세요!\n";
messageText.textContent =
  howToPlay +
  "목숨은 3개! 초록 아이템은 총알 두 발, 노란 아이템은 방어막이에요.\n" +
  (touchMode ? "오른쪽 아래 버튼으로 소리를 켜고 끌 수 있어요." : "오른쪽 아래 버튼이나 M 키로 소리를 켜고 끌 수 있어요.") +
  (bestScore > 0 ? "\n최고 점수: " + bestScore : "");
resetGame();
spawnAliens();
fitCanvas();
requestAnimationFrame(gameLoop);
</script>
